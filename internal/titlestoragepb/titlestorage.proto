syntax = "proto3";

package openpak.titlestorage.v1;

option go_package = "github.com/openpak/title-storage/proto/openpak/titlestorage/v1;titlestoragev1";

// The neutral per-title, per-account storage. Two shapes of data live under a title key that is
// the same on every network (title_keys maps (network, native id) to it):
//
//   * variables: int64 slots (title, owner, slot) with the Title User Storage semantics: set,
//     add, compare-and-set, multi-slot and multi-user reads, friend reads, who-wrote-it and
//     when. Every write stamps the writer and a 10 ms timestamp that conditions can match.
//   * objects: named blobs (title, owner, collection, name) with a small opaque info field,
//     JSON metadata, a body, a visibility and an optional expiry. A stable numeric id is
//     assigned on first write (a NEX DataStore data id, a course id). Collections separate
//     uses inside one title ("tus" slots, "uploads", "courses", a SAKE table).
//
// An owner is a core account id (UUID) or a title-wide virtual user "v:<name>". Adapters map
// their own ids (NpId, XUID, PID, profile id) to accounts before calling. Every request names
// the caller's network ("np", "x360", "wiiu", "switch", "wfc", "xbox") and the title as that
// network knows it. Titles are cross-network by default; a title with cross_network=false only
// shows each network the rows that network wrote itself.
//
// Reads take a viewer (a core account id): private rows are visible to their owner only,
// friends rows to the owner's friends (the account core's friend list), public rows to anyone,
// recipients objects (v0.6.0) to their owner and the accounts named in recipients (and, with
// recipients_include_friends, the owner's friends).
// Virtual owners are always readable and writable by every account. An empty viewer is an
// anonymous reader: public rows only. Writes take a writer: it must be the owner, or a
// virtual owner, or an account the account core lets the writer interact with.
service TitleStorage {
  // Variables
  rpc SetVariables(SetVariablesRequest) returns (SetVariablesResponse);
  rpc ListVariables(ListVariablesRequest) returns (ListVariablesResponse);
  rpc AddVariable(AddVariableRequest) returns (VariableResult);
  // TrySetVariable stores value when "operand <op> current" holds (a missing slot counts as 0).
  rpc TrySetVariable(TrySetVariableRequest) returns (VariableResult);
  rpc DeleteVariables(DeleteVariablesRequest) returns (DeleteResponse);

  // Objects
  rpc PutObject(PutObjectRequest) returns (ObjectResponse);
  rpc GetObject(GetObjectRequest) returns (ObjectResponse);
  rpc GetObjectByID(GetObjectByIDRequest) returns (ObjectResponse);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc DeleteObjects(DeleteObjectsRequest) returns (DeleteResponse);
  // UpdateObjectMeta (v0.7.0) changes an object's metadata only: info, meta_json (replace and/or
  // merge), name, collection, visibility and recipients, expiry, setter. It never touches the body
  // (inline or blob), the size, the id or the ratings. PutObject is the other way round: it
  // replaces the whole object, and over a blob-backed object it drops the blob.
  rpc UpdateObjectMeta(UpdateObjectMetaRequest) returns (ObjectResponse);

  // Blob tier: a body that should not travel inline (a video, a course with replays) goes to S3
  // directly from the console. PrepareUpload checks the quota and the size cap, reserves the
  // object id and returns a short-lived presigned request; the console sends the bytes; the
  // adapter calls CompleteUpload, which checks the size (and the digest when one was given) and
  // makes the object visible. Reads of a blob-backed object carry get_url (presigned) instead of
  // a body. An upload not completed within the upload lifetime expires and its bytes are deleted.
  rpc PrepareUpload(PrepareUploadRequest) returns (PrepareUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (ObjectResponse);

  // Ratings (v0.5.0): numeric rating slots on an object (NEX DataStore ratings, likes, stars).
  // A slot carries its policy (initial value, range, lock, flags) and a running total and count;
  // every rater has one row per (object, slot) holding what it contributed, so a lock can be
  // checked and an erased rater's contribution taken back out. Deleting an object deletes its
  // ratings.
  //
  // InitRating creates a slot with its policy (a slot that exists is kept as it is: the first
  // policy wins). The writer follows the write rule for the object's owner.
  rpc InitRating(InitRatingRequest) returns (RatingResponse);
  // RateObject adds the rater's value to the slot (or, on a modifiable slot, replaces the rater's
  // previous value). A slot that does not exist yet is created with the request's policy; without
  // one it is InvalidArgument. A locked rater gets locked=true and the slot unchanged.
  rpc RateObject(RateObjectRequest) returns (RatingResponse);
  rpc GetRatings(GetRatingsRequest) returns (GetRatingsResponse);
  // ResetRatings puts slots back to their initial value with no ratings (every rater's row goes).
  rpc ResetRatings(ResetRatingsRequest) returns (DeleteResponse);

  // Usage reports what one owner holds in one title against the quota.
  rpc Usage(UsageRequest) returns (UsageResponse);

  // Operator calls.
  rpc MapTitle(MapTitleRequest) returns (MapTitleResponse);
  rpc UpsertTitle(UpsertTitleRequest) returns (TitleInfo);
  rpc ListTitles(ListTitlesRequest) returns (ListTitlesResponse);
}

// TitleRef names a title as a caller sees it. With network empty, title is the neutral key.
message TitleRef {
  string network = 1;
  string title   = 2;
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0; // keep what is stored; a new row takes the title's default (private)
  VISIBILITY_PRIVATE     = 1;
  VISIBILITY_FRIENDS     = 2;
  VISIBILITY_PUBLIC      = 3;
  // Objects only (v0.6.0; InvalidArgument on variables and as a title default): readable by the
  // owner and the accounts in Object.recipients, plus the owner's friends when
  // recipients_include_friends is set (NEX DataStore permission 2 "specified" and 4).
  VISIBILITY_RECIPIENTS  = 4;
}

// Condition is the Title User Storage "comp-date" / "comp-setter" check: the write only happens
// when the existing row was last changed at that time by that setter. A missing row fails a set
// condition. Times are Unix milliseconds with 10 ms resolution.
message Condition {
  optional int64  expect_updated_unix_ms = 1;
  optional string expect_setter          = 2;
}

// ---- variables ----

message Variable {
  string owner            = 1;
  int32  slot             = 2;
  int64  value            = 3;
  string setter           = 4; // adapter-opaque (the PS3 JID); stored as given
  int64  updated_unix_ms  = 5;
  Visibility visibility   = 6;
  string network          = 7; // the network that wrote it
}

message VariableItem {
  int32 slot  = 1;
  int64 value = 2;
}

message SetVariablesRequest {
  TitleRef ref   = 1;
  string owner   = 2;
  string writer  = 3; // account id; "setter" is what the row remembers
  string setter  = 4;
  repeated VariableItem items = 5;
  Visibility visibility       = 6;
}
message SetVariablesResponse {}

message ListVariablesRequest {
  TitleRef ref   = 1;
  string viewer  = 2;
  // The scope: these owners, or the viewer's friends (plus the viewer when include_self).
  repeated string owners = 3;
  bool friends_of_viewer = 4;
  bool include_self      = 5;
  repeated int32 slots   = 6; // empty = every slot
  string sort            = 7; // "updated" (default) | "value" | "slot"
  bool ascending         = 8; // default false: newest / largest first
  uint32 offset          = 9;
  uint32 limit           = 10; // default 100, max 1000
}
message ListVariablesResponse {
  repeated Variable variables = 1;
  uint32 hits = 2; // matches before offset and limit
}

message AddVariableRequest {
  TitleRef ref   = 1;
  string owner   = 2;
  string writer  = 3;
  string setter  = 4;
  int32  slot    = 5;
  int64  delta   = 6;
  Condition condition = 7;
  Visibility visibility = 8;
}

message TrySetVariableRequest {
  TitleRef ref   = 1;
  string owner   = 2;
  string writer  = 3;
  string setter  = 4;
  int32  slot    = 5;
  int64  value   = 6;
  string op      = 7; // eq | ne | gt | ge | lt | le
  int64  operand = 8; // compared with the current value; adapters pass value when they have no other
  Condition condition = 9;
  Visibility visibility = 10;
}

message VariableResult {
  Variable variable       = 1; // the slot after the call (unchanged when stored is false)
  bool stored             = 2;
  bool condition_failed   = 3; // a Condition did not hold; nothing was written
  bool had_previous       = 4;
  int64 previous_value    = 5;
}

message DeleteVariablesRequest {
  TitleRef ref   = 1;
  string owner   = 2;
  string writer  = 3;
  repeated int32 slots = 4;
}

message DeleteResponse { uint32 deleted = 1; }

// ---- objects ----

// Object is a stored blob's metadata; the body is carried only when asked for.
message Object {
  uint64 id          = 1;
  string title       = 2; // neutral key
  string owner       = 3;
  string collection  = 4;
  string name        = 5;
  bytes  info        = 6; // opaque, at most 4096 bytes
  string meta_json   = 7; // a JSON object, at most 16 KiB; filterable with ListObjects.meta_filter_json
  bytes  body        = 8;
  uint64 size        = 9;
  string setter      = 10;
  Visibility visibility = 11;
  string network     = 12;
  int64  created_unix_ms = 13;
  int64  updated_unix_ms = 14;
  int64  expires_unix_ms = 15; // 0 = never
  // Blob tier: set when the body lives in S3 (body is then always empty, include_body or not).
  string get_url     = 16; // presigned GET, short-lived; empty for an inline object
  bool   blob        = 17;
  string sha256      = 18; // hex, when the uploader gave one
  repeated Rating ratings = 19; // with include_ratings (v0.5.0): every rating slot of the object
  // Recipients (v0.6.0): account ids (lowercase UUIDs). They grant reads only under
  // VISIBILITY_RECIPIENTS; under another visibility they are stored and returned as given.
  repeated string recipients = 20;
  bool recipients_include_friends = 21;
}

message PutObjectRequest {
  TitleRef ref    = 1;
  string owner    = 2;
  string writer   = 3;
  string setter   = 4;
  string collection = 5; // default "default"
  string name     = 6;   // empty: a new object named by its id
  bytes info      = 7;
  string meta_json = 8;
  bytes body      = 9;
  Visibility visibility = 10;
  uint32 ttl_seconds = 11; // 0 = keeps its current expiry (never for a new object)
  Condition condition = 12;
  // v0.6.0: stored whenever visibility is set (replacing the stored list, an empty list clears it);
  // with VISIBILITY_UNSPECIFIED the stored recipients and flag are kept. At most 256 account ids.
  repeated string recipients = 13;
  bool recipients_include_friends = 14;
}

message GetObjectRequest {
  TitleRef ref    = 1;
  string viewer   = 2;
  string owner    = 3; // empty: the newest object of that name under any owner (use only with unguessable names)
  string collection = 4;
  string name     = 5;
  bool include_body = 6;
}

message GetObjectByIDRequest {
  string network = 1; // the caller's network: a per-network title hides other networks' objects
  string viewer  = 2;
  uint64 id      = 3;
  bool include_body = 4;
  bool include_ratings = 5; // v0.5.0
}

// ObjectResponse: found=false is "no such object or not visible to the viewer" (the same answer,
// so a viewer cannot probe for private rows). condition_failed is only set by PutObject.
message ObjectResponse {
  Object object = 1;
  bool found    = 2;
  bool condition_failed = 3;
}

message ListObjectsRequest {
  TitleRef ref   = 1;
  string viewer  = 2;
  repeated string owners = 3;
  bool friends_of_viewer = 4;
  bool include_self      = 5;
  string collection      = 6; // empty = every collection
  repeated string names  = 7; // empty = every name
  string meta_filter_json = 8; // objects whose metadata contains this JSON (jsonb @>)
  // "updated" (default) | "created" | "size" | "name" | "id"; "rating:<slot>" (the slot's total)
  // and "rating_avg:<slot>" (its average) sort by a rating slot (v0.5.0; InvalidArgument before).
  string sort            = 9;
  bool ascending         = 10;
  uint32 offset          = 11;
  uint32 limit           = 12; // default 100, max 1000
  bool include_body      = 13;
  // Search (v0.4.0). Every filter is optional (0 / empty = not applied) and they combine with AND.
  // Time bounds are Unix ms and inclusive.
  int64 created_after_ms  = 14;
  int64 created_before_ms = 15;
  // Numeric ranges on top-level metadata keys, inclusive:
  // {"data_type": {"ge": 1, "le": 5}, "plays": {"ge": 10}}. An object whose key is missing or not
  // a JSON number does not match. At most 8 keys; keys are [A-Za-z0-9_.-]{1,64}.
  string meta_range_json  = 16;
  // Every owner in the title (visibility still applies) instead of owners / friends_of_viewer.
  bool all_owners         = 17;
  repeated string exclude_owners = 18; // left out of any scope (NEX "anybody except")
  int64 updated_after_ms  = 19;
  int64 updated_before_ms = 20;
  repeated string collections = 21; // any of these collections (with collection: either)
  // Ratings (v0.5.0): only objects whose sorted rating slot has at least this many ratings (NEX
  // MinimalRatingFrequency); needs a rating sort.
  uint32 min_rating_count = 22;
  bool include_ratings    = 23;
  // v0.6.0: only objects whose recipients name the viewer (NEX SearchTypeReceived); needs a viewer.
  // Visibility still applies, so a private object naming the viewer stays hidden.
  bool received           = 24;
}
message ListObjectsResponse {
  repeated Object objects = 1;
  uint32 hits = 2;
}

// UpdateObjectMetaRequest: every field is optional and only the fields set change (at least one
// must be set). The writer follows the write rule for the object's owner. found=false is "no such
// object" (missing, expired or another network's on a per-network title).
message UpdateObjectMetaRequest {
  string network = 1; // the caller's network (a per-network title hides other networks' objects)
  uint64 id      = 2;
  string writer  = 3;
  string setter  = 4;           // empty keeps the stored setter
  optional bytes info = 5;      // at most 4096 bytes (NEX UpdateObjectMetaBinary)
  optional string meta_json = 6; // replaces the metadata (a JSON object)
  // Merged into the metadata after meta_json (top-level keys, jsonb ||; a key set to null stays as
  // null): tags, period, flags without a read-modify-write. The result is at most 16 KiB.
  string meta_merge_json = 7;
  optional string name = 8;       // rename within the owner (AlreadyExists when taken)
  optional string collection = 9; // move (NEX UpdateObjectDataType); AlreadyExists when the name is taken there
  // UNSPECIFIED keeps visibility, recipients and the flag; set: all three are replaced (as PutObject).
  Visibility visibility = 10;
  repeated string recipients = 11;
  bool recipients_include_friends = 12;
  optional int64 expires_unix_ms = 13; // 0 = never expires; otherwise a future Unix-ms time (NEX period)
  // Optimistic check against the stored object (its updated time and setter, as PutObject):
  // condition_failed=true and nothing changes when it does not hold.
  Condition condition = 14;
}

message DeleteObjectsRequest {
  TitleRef ref   = 1;
  string owner   = 2;
  string writer  = 3;
  string collection = 4;
  repeated string names = 5; // empty = the whole collection
}

// ---- blob tier ----

message PrepareUploadRequest {
  TitleRef ref    = 1;
  string owner    = 2;
  string writer   = 3;
  string setter   = 4;
  string collection = 5; // default "default"
  string name     = 6;   // empty: a new object named by its id
  uint64 size     = 7;   // exact body size; at most the title's max_object_bytes, within quota
  string sha256   = 8;   // optional lowercase hex; CompleteUpload checks it
  bytes info      = 9;
  string meta_json = 10;
  Visibility visibility = 11;
  uint32 ttl_seconds = 12; // of the object once complete (0 keeps the current expiry)
  bool post_form  = 13;  // false: a PUT URL; true: a POST form (S3 POST policy, as NEX DataStore consoles send)
  repeated string recipients = 14; // v0.6.0: as PutObjectRequest, applied at CompleteUpload
  bool recipients_include_friends = 15;
}

message PrepareUploadResponse {
  uint64 id       = 1; // the object id it will have (the existing one's when it replaces an object)
  string method   = 2; // "PUT" or "POST"
  string put_url  = 3; // where to send the body
  map<string, string> headers     = 4; // to send with the PUT
  map<string, string> form_fields = 5; // POST only: the fields to send before the file field ("file")
  int64  expires_unix_ms = 6; // the upload must be completed before this
}

message CompleteUploadRequest {
  uint64 id     = 1;
  string writer = 2; // the same rule as any write to the owner
}

// ---- ratings ----

// RatingPolicy is a slot's behaviour, fixed when the slot is created (NEX DataStoreRatingInitParam).
message RatingPolicy {
  int64 initial_value = 1; // the total a slot starts from
  // "none" (default): rate any number of times; "interval": once per interval_seconds;
  // "period": once until the next period boundary; "permanent": once per rater, ever.
  string lock = 2;
  uint32 interval_seconds = 3;
  // lock "period": the boundary is period_hour (0-23, UTC) on period_day: -17 = the 1st of the
  // next month, -1..-7 = the next Monday..Sunday after the rating day (NEX RatingLockPeriod).
  int32 period_day  = 4;
  int32 period_hour = 5;
  optional int64 range_min = 6; // a value outside [range_min, range_max] is InvalidArgument
  optional int64 range_max = 7;
  bool modifiable = 8;          // a rater's repeat replaces its value (the count stays) instead of adding a rating
  bool round_minus = 9;         // a negative value counts as 0 (before the range check)
  bool disable_self_rating = 10; // the object's owner may not rate it (PermissionDenied)
}

message Rating {
  uint64 id   = 1; // the object
  int32 slot  = 2; // 0-255
  int64 total = 3; // initial_value plus every rating
  uint32 count = 4;
  int64 initial_value = 5;
  RatingPolicy policy = 6;
  // With a rater on the request: that rater's row.
  bool rated = 7;
  int64 rater_value = 8;  // what the rater contributed (its current value on a modifiable slot)
  uint32 rater_count = 9;
  int64 rated_unix_ms = 10; // its last rating
  int64 lock_expires_unix_ms = 11; // 0 = may rate now; -1 = never again (permanent)
}

message InitRatingRequest {
  string network = 1; // the caller's network (a per-network title hides other networks' objects)
  uint64 id      = 2;
  string writer  = 3;
  int32 slot     = 4;
  RatingPolicy policy = 5;
}

message RateObjectRequest {
  string network = 1;
  uint64 id      = 2;
  int32 slot     = 3;
  string rater   = 4; // a core account id; it must be able to read the object
  int64 value    = 5;
  RatingPolicy policy = 6; // creates the slot when it does not exist yet; ignored otherwise
}

// RatingResponse: found=false is "no such object or not visible" (as ObjectResponse).
message RatingResponse {
  Rating rating = 1; // the slot after the call, with the rater's row
  bool found    = 2;
  bool locked   = 3; // the rater is locked out: nothing changed, rating.lock_expires_unix_ms says until when
}

message GetRatingsRequest {
  string network = 1;
  string viewer  = 2;
  repeated uint64 ids  = 3; // max 1000; objects the viewer cannot read are left out
  repeated int32 slots = 4; // empty = every slot
  string rater   = 5;       // optional: fill in this account's rows (rated, lock)
}
message GetRatingsResponse { repeated Rating ratings = 1; } // by id, then slot; slots never created are absent

message ResetRatingsRequest {
  string network = 1;
  uint64 id      = 2;
  string writer  = 3; // the write rule for the object's owner
  repeated int32 slots = 4; // empty = every slot
}

// ---- quota ----

message UsageRequest {
  TitleRef ref = 1;
  string owner = 2;
}
message UsageResponse {
  uint64 bytes = 1;
  uint32 objects = 2;
  uint32 variables = 3;
  uint64 quota_bytes = 4;
  uint32 quota_objects = 5;
  uint32 max_object_bytes = 6;
}

// ---- operator ----

message MapTitleRequest {
  string title      = 1; // neutral key
  string name       = 2;
  string network    = 3;
  string native_id  = 4;
}
message MapTitleResponse {}

enum Tristate {
  TRISTATE_UNSPECIFIED = 0;
  TRISTATE_TRUE        = 1;
  TRISTATE_FALSE       = 2;
}

message UpsertTitleRequest {
  string title = 1;
  string name  = 2;
  Tristate cross_network = 3;
  uint64 quota_bytes     = 4; // 0 = keep (the service default for a new title)
  uint32 quota_objects   = 5;
  uint32 max_object_bytes = 6;
  Visibility default_visibility = 7;
}

message TitleInfo {
  string title = 1;
  string name  = 2;
  bool cross_network = 3;
  uint64 quota_bytes = 4;
  uint32 quota_objects = 5;
  uint32 max_object_bytes = 6;
  Visibility default_visibility = 7;
  map<string, string> native_ids = 8; // network -> native id
}

message ListTitlesRequest {}
message ListTitlesResponse { repeated TitleInfo titles = 1; }
