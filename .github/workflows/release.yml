name: release

# Tag a release (v1.2.3) and this publishes ghcr.io/openpak/<repo>:1.2.3 and :latest.
# Deployed hosts run podman-auto-update against :latest, so pushing a tag is the deploy.
#
# Needs an org secret OPENPAK_MODULE_TOKEN: a token with read access to the private
# github.com/openpak/nex repository. GITHUB_TOKEN only covers this repository, so without it
# the build cannot fetch the shared NEX host. Every NEX title server needs the same secret.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # amd64 + arm64 (the deploy host is aarch64). The Dockerfile cross-compiles from the
      # native build stage, so no QEMU emulation is involved.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            netrc=machine github.com login x-access-token password ${{ secrets.OPENPAK_MODULE_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
